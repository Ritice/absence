services:
  mysql:
    image: mysql:8.0
    container_name: sprintpay-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?définis MYSQL_DATABASE dans .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?définis MYSQL_ROOT_PASSWORD dans .env}
      MYSQL_USER: ${MYSQL_USER:?définis MYSQL_USER dans .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?définis MYSQL_PASSWORD dans .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sprintpay-net

  backend:
    build:
      context: ./backend
    container_name: sprintpay-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_SHOW_SQL: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - sprintpay-net

  frontend:
    build:
      context: ./frontend
    container_name: sprintpay-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - sprintpay-net

volumes:
  mysql_data:

networks:
  sprintpay-net:
    driver: bridge